AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Intelligent Cloud Automation - AIOps MVP

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0fd9c4fa5b18e4ee5
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-03c8974ca9eaf6d23
  AmiId:
    Type: String
    Default: ami-0332d564d76dbd8d6
  InstanceType:
    Type: String
    Default: t3.micro
  GeminiApiKey:
    Type: String
    NoEcho: true
  ReportsEmailAddress:
    Type: String
    Description: Email address to receive daily AIOps reports
  IncidentEmailAddress:
    Type: String
    Description: Email address to receive incident notifications
  DeploymentBucketName:
    Type: String
    Default: aiops-demo-deploy-056793557028
    Description: Existing S3 bucket used for immutable demo-app release artifacts
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  # -----------------------------------------
  # AIOps EC2 Security Group
  # -----------------------------------------
  AIOpsEC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AIOps MVP demo EC2 security group
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: AIOps-Demo-SG

  # -----------------------------------------
  # AIOps EC2 IAM Role
  # -----------------------------------------
  AIOpsEC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: DemoAppDeploymentRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${DeploymentBucketName}/releases/*

  # -----------------------------------------
  # AIOps EC2 Instance Profile
  # -----------------------------------------
  AIOpsEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AIOpsEC2InstanceRole

  # -----------------------------------------
  # AIOps Demo EC2
  # -----------------------------------------
  AIOpsEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref AIOpsEC2SecurityGroup
      IamInstanceProfile: !Ref AIOpsEC2InstanceProfile
      Tags:
        - Key: Name
          Value: AIOps-Demo-EC2
        - Key: Project
          Value: AIOps-MVP

  # -----------------------------------------
  # AIOps Demo CloudWatch Alarm
  # -----------------------------------------
  AIOpsHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: AIOps-Test-HighCPU
      AlarmDescription: Trigger the AIOps MVP workflow when EC2 CPU usage is high
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref AIOpsEC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # -----------------------------------------
  # CloudWatch Log Groups (application logs)
  # -----------------------------------------
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aiops/demo-app/application
      RetentionInDays: 30

  ErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aiops/demo-app/errors
      RetentionInDays: 30

  # -----------------------------------------
  # Daily Reports SNS Topic
  # -----------------------------------------
  ReportsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: aiops-reports

  ReportsTopicEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ReportsTopic
      Protocol: email
      Endpoint: !Ref ReportsEmailAddress

  # -----------------------------------------
  # AIOps Analytics Engine Lambda
  # -----------------------------------------
  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aiops-analytics
      CodeUri: .
      Handler: src/analytics/dailyReport.handler
      Timeout: 300
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
          REPORTS_TOPIC_ARN: !Ref ReportsTopic
          EC2_INSTANCE_ID: !Ref AIOpsEC2
          APP_LOG_GROUP: /aiops/demo-app/application
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ReportsTopic
            - Effect: Allow
              Action:
                - cloudwatch:GetMetricStatistics
              Resource: "*"
            - Effect: Allow
              Action:
                - logs:StartQuery
                - logs:GetQueryResults
                - logs:StopQuery
              Resource:
                - !GetAtt ApplicationLogGroup.Arn
                - !GetAtt ErrorLogGroup.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/analytics/dailyReport.ts
        Minify: true
        Target: es2022
        Sourcemap: false
        External:
          - "@aws-sdk/client-cloudwatch"
          - "@aws-sdk/client-cloudwatch-logs"
          - "@aws-sdk/client-sns"

  # -----------------------------------------
  # EventBridge Daily Schedule
  # -----------------------------------------
  DailyReportSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: aiops-daily-report
      Description: Trigger the AIOps Analytics Engine every day at midnight UTC
      ScheduleExpression: cron(0 0 * * ? *)
      State: ENABLED
      Targets:
        - Id: AnalyticsLambda
          Arn: !GetAtt AnalyticsFunction.Arn

  AnalyticsEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalyticsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyReportSchedule.Arn

  # -----------------------------------------
  # Incident Notification Topic
  # -----------------------------------------
  IncidentTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: aiops-incidents

  IncidentTopicEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref IncidentTopic
      Protocol: email
      Endpoint: !Ref IncidentEmailAddress

  # -----------------------------------------
  # AIOps Coordinator Lambda
  # -----------------------------------------
  CoordinatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aiops-coordinator
      CodeUri: .
      Handler: src/coordinator/app.handler
      Timeout: 540
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
          SNS_TOPIC_ARN: !Ref IncidentTopic
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref IncidentTopic
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeInstanceStatus
                - cloudwatch:GetMetricStatistics
              Resource: "*"
            - Effect: Allow
              Action:
                - ssm:SendCommand
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
                - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${AIOpsEC2}
            - Effect: Allow
              Action:
                - ssm:GetCommandInvocation
              Resource: "*"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/coordinator/app.ts
        Minify: true
        Target: es2022
        Sourcemap: false
        External:
          - "@aws-sdk/client-cloudwatch"
          - "@aws-sdk/client-ec2"
          - "@aws-sdk/client-sns"
          - "@aws-sdk/client-ssm"

  # -----------------------------------------
  # EventBridge Incident Rule
  # -----------------------------------------
  IncidentEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: aiops-cloudwatch-incidents
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
        detail:
          state:
            value:
              - ALARM
      Targets:
        - Id: CoordinatorLambda
          Arn: !GetAtt CoordinatorFunction.Arn

  # -----------------------------------------
  # Allow EventBridge to invoke Lambda
  # -----------------------------------------
  CoordinatorEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CoordinatorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IncidentEventRule.Arn

Outputs:
  AIOpsEC2:
    Description: AIOps demo EC2 instance ID
    Value: !Ref AIOpsEC2

  AIOpsEC2SecurityGroup:
    Description: Security group for the AIOps demo EC2 instance
    Value: !Ref AIOpsEC2SecurityGroup

  AIOpsHighCPUAlarm:
    Description: CloudWatch alarm that drives the AIOps workflow
    Value: !Ref AIOpsHighCPUAlarm

  CoordinatorFunction:
    Description: AIOps Coordinator Lambda
    Value: !GetAtt CoordinatorFunction.Arn

  IncidentTopic:
    Description: SNS topic for incident notifications
    Value: !Ref IncidentTopic

  IncidentEventRule:
    Description: EventBridge incident rule
    Value: !GetAtt IncidentEventRule.Arn

  AnalyticsFunction:
    Description: AIOps Analytics Engine Lambda
    Value: !GetAtt AnalyticsFunction.Arn

  ReportsTopic:
    Description: SNS topic for daily AIOps reports
    Value: !Ref ReportsTopic

  DailyReportSchedule:
    Description: EventBridge rule for daily analytics
    Value: !GetAtt DailyReportSchedule.Arn

  DeploymentBucketName:
    Description: S3 bucket containing immutable demo-app releases
    Value: !Ref DeploymentBucketName
